name: MLOps CI Pipeline

on:
  push:
    branches:
      - main
      - integration/final

  pull_request:
    branches:
      - main

jobs:
  validate-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Validate Python syntax
        run: |
          python -m compileall tracks pipelines api

      - name: Validate Docker Compose
        run: |
          docker compose config

      - name: Build Geography API
        run: |
          docker build \
            -f docker/geography/Dockerfile \
            -t geography-api:ci .

      - name: Build Cost API
        run: |
          docker build \
            -f docker/cost/Dockerfile \
            -t cost-api:ci .

      - name: Build Conditions API
        run: |
          docker build \
            -f docker/conditions/Dockerfile \
            -t conditions-api:ci .