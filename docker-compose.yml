version: "3.8"

# ==============================================================================
# Fleet Logistics MLOps Pipeline — docker-compose skeleton
# Covers: Kafka streaming, Airflow orchestration, MLflow tracking,
#         and 4 independent FastAPI services (one per track).
#
# NOTE: This is a STARTING SKELETON, not a finished file. Fill in the TBD
# sections as each track's service gets built. Ports are pre-assigned below
# so nobody collides when adding their service.
# ==============================================================================

services:

  # ---------------------------------------------------------------------------
  # Kafka streaming (simulates live fleet/order data)
  # ---------------------------------------------------------------------------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports:
      - "9092:9092"
      - "29092:29092"

  # ---------------------------------------------------------------------------
  # Airflow (single-node dev setup: Postgres metadata DB + webserver + scheduler)
  # Uses LocalExecutor — fine for a course project, not for real production scale.
  # ---------------------------------------------------------------------------
  airflow-db:
    image: postgres:15
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow-db-data:/var/lib/postgresql/data

  airflow-init:
    image: apache/airflow:2.9.0
    depends_on:
      - airflow-db
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db/airflow
    entrypoint: /bin/bash
    command: -c "airflow db init && airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@example.com"

  airflow-webserver:
    image: apache/airflow:2.9.0
    depends_on:
      - airflow-init
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db/airflow
    volumes:
      - ./pipelines/airflow/dags:/opt/airflow/dags
    ports:
      - "8080:8080"
    command: webserver

  airflow-scheduler:
    image: apache/airflow:2.9.0
    depends_on:
      - airflow-init
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db/airflow
    volumes:
      - ./pipelines/airflow/dags:/opt/airflow/dags
    command: scheduler

  # ---------------------------------------------------------------------------
  # MLflow tracking server — shared by all 4 tracks' training scripts
  # ---------------------------------------------------------------------------
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.14.1
    ports:
      - "5000:5000"
    volumes:
      - ./models/mlflow:/mlflow
    command: >
      mlflow server
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --default-artifact-root /mlflow/artifacts
      --host 0.0.0.0
      --port 5000

  # ---------------------------------------------------------------------------
  # Track services — one FastAPI container per track.
  # Each has its OWN Dockerfile under docker/<track>/Dockerfile (TBD, build by
  # the person owning that track). Ports are pre-assigned so there's no clash.
  # ---------------------------------------------------------------------------
  geography-api:      # Student 1 — Geography & Route (trip duration under traffic)
    build:
      context: ./tracks/geography
      dockerfile: ../../docker/geography/Dockerfile   # TBD: create this Dockerfile
    ports:
      - "8001:8000"
    depends_on:
      - mlflow
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000

  telemetry-api:       # Student 2 — Truck Telemetry (fuel consumption)
    build:
      context: ./tracks/vehicle
      dockerfile: ../../docker/vehicle/Dockerfile      # TBD: create this Dockerfile
    ports:
      - "8002:8000"
    depends_on:
      - mlflow
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000

  payload-api:          # Student 3 — Cargo Payload (engine wear from load)
    build:
      context: ./tracks/cost
      dockerfile: ../../docker/cost/Dockerfile         # TBD: create this Dockerfile
    ports:
      - "8003:8000"
    depends_on:
      - mlflow
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000

  environment-api:      # Student 4 — Environment/Weather (aerodynamic fuel efficiency)
    build:
      context: ./tracks/conditions
      dockerfile: ../../docker/conditions/Dockerfile   # TBD: create this Dockerfile
    ports:
      - "8004:8000"
    depends_on:
      - mlflow
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000

  # ---------------------------------------------------------------------------
  # Optional: a single gateway that reverse-proxies all 4 track APIs under one
  # host:port for the demo video / report, so you can show "one system" even
  # though it's 4 containers. TBD — only add this if integration time allows.
  # ---------------------------------------------------------------------------
  # gateway:
  #   image: nginx:alpine
  #   ports:
  #     - "8000:80"
  #   volumes:
  #     - ./docker/gateway/nginx.conf:/etc/nginx/nginx.conf:ro
  #   depends_on:
  #     - geography-api
  #     - telemetry-api
  #     - payload-api
  #     - environment-api

volumes:
  airflow-db-data:
