
services:

  # ---------------------------------------------------------------------------
  # Kafka streaming
  # ---------------------------------------------------------------------------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports:
      - "9092:9092"
      - "29092:29092"

  # ---------------------------------------------------------------------------
  # Airflow
  # ---------------------------------------------------------------------------
  airflow-db:
    image: postgres:15
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow-db-data:/var/lib/postgresql/data

  airflow-init:
    image: apache/airflow:2.9.0
    depends_on:
      - airflow-db
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db/airflow
      AIRFLOW__WEBSERVER__SECRET_KEY: mlops-logistics-router-airflow-key
    entrypoint: /bin/bash
    command: >
      -c "airflow db init &&
      airflow users create
      --username admin
      --password admin
      --firstname Admin
      --lastname User
      --role Admin
      --email admin@example.com"

  airflow-webserver:
    image: apache/airflow:2.9.0
    depends_on:
      - airflow-init
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db/airflow
      AIRFLOW__WEBSERVER__SECRET_KEY: mlops-logistics-router-airflow-key
      PROJECT_PATH: ${PROJECT_PATH}
      DOCKER_NETWORK: ${DOCKER_NETWORK}
    volumes:
      - ./pipelines/airflow/dags:/opt/airflow/dags
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "8080:8080"
    command: webserver

  airflow-scheduler:
    image: apache/airflow:2.9.0
    depends_on:
      - airflow-init
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db/airflow
      AIRFLOW__WEBSERVER__SECRET_KEY: mlops-logistics-router-airflow-key
      PROJECT_PATH: ${PROJECT_PATH}
      DOCKER_NETWORK: ${DOCKER_NETWORK}
    volumes:
      - ./pipelines/airflow/dags:/opt/airflow/dags
      - /var/run/docker.sock:/var/run/docker.sock
    command: scheduler

  # ---------------------------------------------------------------------------
  # MLflow
  # ---------------------------------------------------------------------------
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.14.1
    ports:
      - "5000:5000"
    volumes:
      - ./models/mlflow:/mlflow
    command: >
      mlflow server
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --serve-artifacts
      --artifacts-destination /mlflow/artifacts
      --host 0.0.0.0
      --port 5000

  # ---------------------------------------------------------------------------
  # Geography API
  # ---------------------------------------------------------------------------
  geography-api:
    build:
      context: .
      dockerfile: docker/geography/Dockerfile
    ports:
      - "8001:8000"
    depends_on:
      - mlflow
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
    volumes:
      - ./monitoring/geography:/opt/project/monitoring/geography

  # ---------------------------------------------------------------------------
  # Vehicle API
  # Keep existing slot for later integration
  # ---------------------------------------------------------------------------
  telemetry-api:
    build:
      context: .
      dockerfile: docker/vehicle/Dockerfile
    ports:
      - "8002:8000"
    depends_on:
      - mlflow
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
    volumes:
      - ./data/processed:/opt/project/data/processed  

  # ---------------------------------------------------------------------------
  # Cost API
  # ---------------------------------------------------------------------------
  cost-api:
    build:
      context: .
      dockerfile: docker/cost/Dockerfile
    ports:
      - "8003:8000"
    depends_on:
      - mlflow
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
    volumes:
      - ./monitoring/cost:/opt/project/monitoring/cost

  # ---------------------------------------------------------------------------
  # Conditions API
  # ---------------------------------------------------------------------------
  conditions-api:
    build:
      context: .
      dockerfile: docker/conditions/Dockerfile
    ports:
      - "8004:8000"
    depends_on:
      - mlflow
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
    volumes:
      - ./monitoring/conditions:/opt/project/monitoring/conditions  

  integration-api:
    build:
      context: .
      dockerfile: docker/integration/Dockerfile
    ports:
      - "8000:8000"
    depends_on:
      - geography-api
      - conditions-api
      - cost-api
      - telemetry-api
    environment:
      GEOGRAPHY_URL: http://geography-api:8000/predict
      CONDITIONS_URL: http://conditions-api:8000/api/v1/conditions/predict
      COST_URL: http://cost-api:8000/predict
      PAYLOAD_URL: http://telemetry-api:8000/api/v1/payload    


  geography-trainer:
    build:
      context: .
      dockerfile: docker/geography/Dockerfile.train
    image: geography-trainer:latest

  conditions-trainer:
    build:
      context: .
      dockerfile: docker/conditions/Dockerfile.train
    image: conditions-trainer:latest

  cost-spark:
    build:
      context: .
      dockerfile: docker/cost/Dockerfile.spark
    image: cost-spark:latest

  cost-trainer:
    build:
      context: .
      dockerfile: docker/cost/Dockerfile.train
    image: cost-trainer:latest

  vehicle-pipeline:
    build:
      context: .
      dockerfile: docker/vehicle/Dockerfile.pipeline
    image: vehicle-pipeline:latest


volumes:
  airflow-db-data: